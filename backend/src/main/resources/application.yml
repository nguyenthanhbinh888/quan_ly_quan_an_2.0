server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: restaurant-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:restaurant_management}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  version: 1.0.0-MVP
  name: "Hệ Thống Quản Lý Quán Ăn API"
  jwt:
    secret: ${JWT_SECRET:cXVhbl9seV9xdWFuX2FuX3NlY3VyZV9qd3Rfc2VjcmV0X2tleV8yMDI2X2FudGlncmF2aXR5X3Byb2plY3Q=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 giờ
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
